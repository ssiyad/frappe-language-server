[package]
name = "xtask"
description = "Repository automation: constant generation, benchmarks, smoke tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The smoke test runs the real checks over a real bench, so it links the
# server rather than reimplementing any part of it.
frappe-index.workspace = true
frappe-lsp = { path = "../crates/frappe-lsp" }
frappe-syntax.workspace = true
tree-sitter.workspace = true
toml.workspace = true
tower-lsp-server.workspace = true
serde.workspace = true
serde_json.workspace = true
# Already built for tracing-subscriber; the drift check scrapes frappe with it.
regex = "1"

[lints]
workspace = true

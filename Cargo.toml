[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/ssiyad/frappe-language-server"

[workspace.dependencies]
frappe-bridge = { path = "crates/frappe-bridge", version = "0.1.0" }
frappe-index = { path = "crates/frappe-index", version = "0.1.0" }
frappe-syntax = { path = "crates/frappe-syntax", version = "0.1.0" }

# 3.0.0 is a squatted release whose whole source is `compile_error!`; 2.0.1 is
# the real latest. `serde` is an optional dependency here, not a feature.
bincode = { version = "2.0.1", features = ["std", "serde"] }
insta = "1.48"
notify = "8.2"
rayon = "1.12"
# The bridge's transport (spec 05). `rustls` rather than the system OpenSSL so
# the binary is one artifact; no default features, because the default pulls a
# cookie store, gzip and a blocking client the bridge never uses.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ropey = "1.6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = "1"
toml = "1.1"
# `tower` and `futures` come with tower-lsp-server already; named here only so
# a panicking request can be caught at the service boundary.
futures = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", default-features = false }
tower-lsp-server = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

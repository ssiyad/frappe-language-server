name: Release

# A tag `<version>` or `v<version>` builds the server for Linux and macOS,
# x86_64 and aarch64, and publishes them with their checksums. Linux builds
# are static (musl), so one file runs on any distribution — task 016. Every
# target builds on its own platform, and the packaged file is driven through
# an editor session before anything is published. A manual run builds and
# checks every archive but publishes nothing.

on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # A tag that does not match the crate version publishes a binary that
      # reports the wrong version to every bug report, and a plugin manifest
      # that lags makes the plugins download the wrong release.
      - name: The tag matches every manifest
        if: github.ref_type == 'tag'
        run: .github/check-versions.sh "$GITHUB_REF_NAME"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            nvim: nvim-linux-x86_64
          # `cross` images are x86_64 only, so the arm runner links
          # against musl itself.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
            nvim: nvim-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            nvim: nvim-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            nvim: nvim-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - if: matrix.musl
        name: musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          CROSS: ${{ matrix.cross }}
        run: |
          tool=cargo
          if [ "$CROSS" = "true" ]; then tool=cross; fi
          "$tool" build --release --locked --package frappe-lsp \
            --target "$TARGET"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="frappe-lsp-$GITHUB_REF_NAME-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/frappe-lsp" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      # What is checked is the archive a user downloads, not the build tree.
      - name: The packaged binary runs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="frappe-lsp-$GITHUB_REF_NAME-$TARGET"
          mkdir unpacked
          tar xzf "$name.tar.gz" -C unpacked
          shasum -a 256 -c "$name.tar.gz.sha256"
          "unpacked/$name/frappe-lsp" --version
          echo "FRAPPE_LSP=$PWD/unpacked/$name/frappe-lsp" >> "$GITHUB_ENV"

      - name: Neovim
        env:
          NVIM: ${{ matrix.nvim }}
        run: |
          base=https://github.com/neovim/neovim/releases/download/v0.12.6
          curl --fail --silent --show-error --location "$base/$NVIM.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$NVIM/bin" >> "$GITHUB_PATH"

      - name: The packaged binary drives an editor
        run: >-
          nvim --clean --headless -l tests/editors/neovim.lua
          tests/fixtures/bench

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: frappe-lsp-*.tar.gz*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  # What a plugin does on first use: the launcher downloads the release just
  # published, checks it and runs it.
  launcher:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: The launcher installs the published release
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/data"
          version=$(bin/frappe-lsp --version)
          echo "$version"
          [ "$version" = "frappe-lsp ${GITHUB_REF_NAME#v}" ]

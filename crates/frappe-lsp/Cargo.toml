[package]
name = "frappe-lsp"
description = "Language server for Frappe Framework apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "frappe-lsp"
path = "src/main.rs"

[dependencies]
frappe-bridge.workspace = true
frappe-index.workspace = true
frappe-syntax.workspace = true
# The fallback watcher, for clients that register none of their own — spec 30.
notify.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
# `process` is the test runner of spec 25 — the one feature that executes
# anything, and it is opt-in.
tokio = { workspace = true, features = ["io-std", "macros", "process", "rt-multi-thread", "time"] }
toml.workspace = true
futures.workspace = true
tower.workspace = true
tower-lsp-server.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
